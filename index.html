<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>QuickNotes API Client</h1>
        
        <div class="controls">
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </div>

        <form id="note-form">
            <h2>Create a Note</h2>
            <div class="form-group">
                <label for="title-input">Title (required, max 100 chars):</label>
                <input type="text" id="title-input" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="body-input">Body:</label>
                <textarea id="body-input"></textarea>
            </div>
            <button type="submit" id="submit-btn">Create Note</button>
        </form>

        <h2>Your Notes</h2>
        <ul id="notes-list"></ul>
    </div>
</body>
</html>
